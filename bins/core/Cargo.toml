[package]
name = "limeos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Deferred code stays out of the shipped binary; see docs/deferred-code.md.
[features]
deferred = [
    "limeos-api/deferred",
    "limeos-domain/deferred",
    "limeos-observations/deferred",
    "limeos-backup-archive/deferred",
]

[dependencies]
limeos-observations = { path = "../../crates/observations", version = "=0.2.0" }
limeos-api = { path = "../../crates/api", version = "=0.2.0" }
limeos-domain = { path = "../../crates/domain", version = "=0.2.0" }
limeos-contracts = { path = "../../crates/contracts", version = "=0.2.0" }
limeos-policy = { path = "../../crates/policy", version = "=0.2.0" }
limeos-persistence = { path = "../../crates/persistence", version = "=0.2.0" }
limeos-identity = { path = "../../crates/identity", version = "=0.2.0" }
limeos-executor-protocol = { path = "../../crates/executor-protocol", version = "=0.2.0" }
tokio.workspace = true
rustix.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
# The soak harness drives retention through the writer's own entry point on
# its simulated clock; dev-only, so the shipped binary never has the seam.
limeos-persistence = { path = "../../crates/persistence", version = "=0.2.0", features = ["test-support"] }
limeos-backup-archive = { path = "../../crates/backup-archive", version = "=0.2.0" }
# The soak harness (tests/soak) drives the real receipt store; test-only.
limeos-executor-container = { path = "../../crates/executor-container", version = "=0.2.0" }

[[test]]
name = "backup_preparation_binding"
required-features = ["deferred"]

[[bin]]
name = "limeos-core"
path = "src/main.rs"

[[bin]]
name = "limeos-password-worker"
path = "src/password_worker.rs"
