[package]
name = "limeos-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "limeos-executor"

[features]
read-worker-probe = []

[[bin]]
name = "limeos-read-worker-probe"
path = "tests/support/read_worker_probe.rs"
required-features = ["read-worker-probe"]
test = false

[lints]
workspace = true

[dependencies]
limeos-observations = { path = "../../crates/observations", version = "=0.2.0" }
limeos-executor-protocol = { path = "../../crates/executor-protocol", version = "=0.2.0" }
limeos-contracts = { path = "../../crates/contracts", version = "=0.2.0" }
limeos-domain = { path = "../../crates/domain", version = "=0.2.0" }
limeos-executor-container = { path = "../../crates/executor-container", version = "=0.2.0" }
limeos-executor-storage = { path = "../../crates/executor-storage", version = "=0.2.0" }
tokio.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
