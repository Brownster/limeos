[package]
name = "limeos-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "limeos-executor"

[[bin]]
name = "limeos-stack-read-worker"
path = "src/stack_read_worker.rs"
test = false

[features]
read-worker-probe = []
# Code with no production caller; see docs/deferred-code.md.
deferred = [
    "limeos-domain/deferred",
    "limeos-executor-container/deferred",
    "limeos-executor-storage/deferred",
    "limeos-observations/deferred",
]

[[bin]]
name = "limeos-read-worker-probe"
path = "tests/support/read_worker_probe.rs"
required-features = ["read-worker-probe"]
test = false

[[bin]]
name = "limeos-combined-read-probe"
path = "tests/support/combined_read_probe.rs"
required-features = ["read-worker-probe"]
test = false

[lints]
workspace = true

[dependencies]
limeos-observations = { path = "../../crates/observations", version = "=0.2.0" }
limeos-executor-protocol = { path = "../../crates/executor-protocol", version = "=0.2.0" }
limeos-contracts = { path = "../../crates/contracts", version = "=0.2.0" }
limeos-domain = { path = "../../crates/domain", version = "=0.2.0" }
limeos-executor-container = { path = "../../crates/executor-container", version = "=0.2.0" }
limeos-executor-storage = { path = "../../crates/executor-storage", version = "=0.2.0" }
tokio.workspace = true
rustix.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
