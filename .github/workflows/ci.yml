name: Foundation, observation and operation gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # The job runs for about 35 to 45 minutes; 40 cut it off in its last step.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # History for the exposure gate's base revision (merge base with main).
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Toolchain and native validation tools
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y shellcheck systemd
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs the soak's quick tests (the 3-day smoke, the backlog, cap and
      # writer tests); its long ones are ignored here and run by the soak job.
      - run: cargo test --workspace --locked
      # Reads the process-wide write counter, so it must run with no other test.
      - name: Idle observation passes write nothing
        run: cargo test -p limeos-core --bin limeos-core --locked -- --ignored --exact automation_runtime::tests::stable_real_runtime_passes_leave_process_write_bytes_unchanged --test-threads=1
      # Deferred code (docs/deferred-code.md) is compiled and tested here only.
      # --workspace enables the feature on every member that declares it.
      - name: Clippy with deferred code
        run: cargo clippy --workspace --all-targets --locked --features deferred -- -D warnings
      - name: Tests with deferred code
        run: cargo test --workspace --locked --features deferred
      # Neither deferred code nor the soak's seams (persistence's
      # test-support, rusqlite's statement trace) in a shipped binary's
      # dependency graph; the release build below checks its own features.
      - name: Shipped binaries exclude deferred code
        run: |
          set -Eeuo pipefail
          enabled=$(cargo tree --locked -e normal,build --prefix none -f '{p}|{f}' -p limeos-core -p limeos-executor -p limeosctl | awk -F'|' '$2 ~ /(^|,)(deferred|test-support|trace)(,|$)/' | sort -u)
          if [[ -n "$enabled" ]]; then printf 'Deferred or test-only feature enabled in a shipped binary:\n%s\n' "$enabled" >&2; exit 1; fi
      - run: cargo deny check
      - run: cargo audit
      - run: shellcheck packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm packaging/repository.sh tests/fixtures/backup-archives/generate.sh
      - name: Cutover scripts lint
        run: shellcheck scripts/cutover/*.sh
      - name: Unit validation
        run: |
          sudo install -d /usr/lib/limeos /var/lib/limeos/core
          cargo build --locked -p limeos-core -p limeos-executor -p limeosctl
          sudo install -m 0755 target/debug/limeos-core target/debug/limeos-executor /usr/lib/limeos/
          systemd-analyze verify packaging/systemd/*.service
      # Offline scoring needs systemd 250+ (24.04 ships 255). Each unit must
      # score no worse than at the merge base, under this same systemd-analyze,
      # and within its recorded ceiling plus a small margin.
      # Base: the merge base with a pull request's target (GITHUB_BASE_REF)
      # or, for a push, with the default branch. A push to the default branch
      # has no merge base to compare with, so there the recorded ceilings
      # alone apply; never a push's previous tip or HEAD^, which would make a
      # worsening pushed once the next push's baseline. A unit deliberately
      # looser than on the default branch has a commented allowance in the
      # script instead.
      - name: Unit exposure ceilings
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/check_unit_exposure.py
      - run: python3 scripts/check_repository.py
      - name: Repository check unit tests
        run: python3 -m unittest discover -s tests/repository -p 'test_*.py'
      - run: python3 scripts/check_contracts.py
      - name: ARM64 qualification evidence and host guards
        run: python3 -m unittest discover -s tests/qualification/arm64 -p 'test_*.py'
      - name: Public-library probe artifact identity checks
        run: python3 -m unittest discover -s tests/reference -p 'test_rw040_probe_artifact.py'
      - name: RW-040 console harness and probe delivery guards
        run: python3 -m unittest discover -s tests/qualification/rw040-combined -p 'test_*.py'
      - name: Evidence bundle build, verify and restore
        run: python3 -m unittest discover -s tests/evidence -p 'test_*.py'
      - name: Cutover scripts (stubbed systemctl/docker)
        run: python3 -m unittest discover -s tests/cutover -p 'test_*.py'
      - run: npm ci --ignore-scripts && npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
      - name: Debian 12 release builds on native architecture
        run: |
          set -Eeuo pipefail
          docker build -t limeos-builder -f packaging/Containerfile .
          build_image_id=$(docker image inspect limeos-builder --format '{{.Id}}')
          mkdir -p dist
          docker run --rm -v "$PWD:/build" "$build_image_id" cargo build --locked --release -p limeos-core -p limeos-executor -p limeosctl --message-format=json-render-diagnostics > dist/shipped-build.jsonl
          # The features this very build resolved: the soak's seams
          # (persistence's test-support, rusqlite's trace) are not among them.
          python3 - dist/shipped-build.jsonl <<'CHECK'
          import json, sys
          forbidden = {"limeos_persistence": "test-support", "rusqlite": "trace"}
          seen = set()
          for line in open(sys.argv[1]):
              message = json.loads(line)
              if message.get("reason") != "compiler-artifact":
                  continue
              name = message["target"]["name"]
              if name in forbidden:
                  seen.add(name)
                  if forbidden[name] in message["features"]:
                      sys.exit(f"{name} built with {forbidden[name]} for a shipped binary: {message['features']}")
          if seen != set(forbidden):
              sys.exit(f"the shipped build did not report {sorted(set(forbidden) - seen)}")
          CHECK
          arch=$(dpkg --print-architecture)
          # Both revision labels use this source; they are not historical builds.
          for package_version in 0.4.4 0.4.4+ci.1; do
            python3 packaging/build.py --arch "$arch" --binaries target/release --version "$package_version"
          done
          python3 packaging/build.py --arch "$arch" --binaries target/release --version 0.4.4 --profile shadow
          if [[ "$arch" == "amd64" ]]; then
            mkdir -p dist/rw040-probe-build-evidence
            docker image inspect "$build_image_id" > dist/rw040-probe-build-evidence/image-inspect.json
            docker run --rm -v "$PWD:/build" "$build_image_id" \
              cargo test -p limeos-executor --test combined_read_probe --locked --release --no-run --message-format=json \
              > dist/rw040-probe-build-evidence/compiler-messages.jsonl \
              2> dist/rw040-probe-build-evidence/compiler-stderr.txt
            docker run --rm -v "$PWD:/build" "$build_image_id" \
              python3 scripts/build_rw040_probe_artifact.py \
              --compiler-messages /build/dist/rw040-probe-build-evidence/compiler-messages.jsonl \
              --image-info /build/dist/rw040-probe-build-evidence/image-inspect.json \
              --source "$GITHUB_SHA" --packages-dir /build/dist \
              --output /build/dist/rw040-public-library-probe \
              --evidence /build/dist/rw040-probe-build-evidence
          fi
      # These gates write tracked evidence. Keep source clean for production,
      # then require both gates before publishing any package or probe.
      - name: Lifecycle, logs and keyboard-focus browser regression
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python3 -m venv /tmp/limeos-browser-check
          /tmp/limeos-browser-check/bin/pip install playwright==1.62.0
          /tmp/limeos-browser-check/bin/python tests/frontend/restart.py
          /tmp/limeos-browser-check/bin/python tests/frontend/stacks.py --output docs/rewrite-evidence/p04/ci-stack-browser
          /tmp/limeos-browser-check/bin/python tests/frontend/shell.py --output /tmp/limeos-shell-browser
          /tmp/limeos-browser-check/bin/python tests/frontend/containers.py --output /tmp/limeos-containers-browser
      - name: Deliberate release-gate rejection probes
        run: python3 scripts/test_gates.py
      # Candidates: published by the publish job once the soak passed too.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-debian-${{ matrix.runner }}
          path: dist/*.deb
          if-no-files-found: error
      - name: Keep the Debian-compatible public-library probe candidate
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-rw040-public-library-probe
          path: dist/rw040-public-library-probe/
          if-no-files-found: error
      - name: Preserve probe build diagnostics
        if: always() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rw040-probe-build-evidence
          path: dist/rw040-probe-build-evidence/

  # PR-41 (docs/soak.md): 90 simulated days of jobs, logins, polls, faults,
  # crashes and restarts through core's own code against the real stores and
  # the executor's own request handling, in two scenarios side by side, with
  # the cap, backlog, occurrence and metrics tests: every ignored test named
  # soak_* (a unit-test module of the core binary, so it can call core). Its
  # own job on both native architectures: under 7 minutes on an 8-core
  # machine once built, more on the arm64 runner, with nothing else to wait
  # for. The stores go on /dev/shm when it has room (a GitHub-hosted runner)
  # and in the temp directory otherwise (a container's 64 MiB /dev/shm); the
  # checks count work, not time. No build cache to reuse: the workflow keeps
  # none.
  soak:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Long-uptime soak (90 simulated days)
        run: cargo test -p limeos-core --bin limeos-core --locked -- --ignored soak_ --nocapture

  # Production runs Debian 12, whose bash 5.2 behaved differently from the
  # runner's bash 5.3 and hid a return.sh defect. The suites whose code runs on
  # the host (cutover and maintainer scripts, the guest and reference-host
  # scripts) run again on Debian 12 in a container, as an unprivileged user;
  # scripts/debian12_suites.sh lists them, and the plan's Phase 4 section says
  # which suites are left out and why. About ten minutes, nearly all of it
  # the cutover suite; it runs beside the check job, so publishing waits no
  # longer for it.
  debian12-suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The multi-arch index of debian:12 (bookworm); change it deliberately.
      DEBIAN_12_IMAGE: debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cutover, maintainer-script and reference suites on Debian 12
        run: docker run --rm -v "$PWD:/src" -w /src -e TEST_UID="$(id -u)" "$DEBIAN_12_IMAGE" bash scripts/debian12_suites.sh

  # Packages and the probe are published only once every gate passed: the
  # check job's, the soak's and the Debian 12 suites'.
  publish:
    needs: [check, soak, debian12-suites]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-debian-${{ matrix.runner }}
          path: dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debian-${{ matrix.runner }}
          path: dist/*.deb
          if-no-files-found: error
      - if: matrix.runner == 'ubuntu-24.04'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: candidate-rw040-public-library-probe
          path: dist/rw040-public-library-probe
      - name: Supply the Debian-compatible public-library probe
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rw040-public-library-probe
          path: dist/rw040-public-library-probe/
          if-no-files-found: error

  # The footprint suite (Phase 4 gates, docs/plans/2026-11-19-production-
  # readiness-plan.md) adds about 18 minutes (a 6-minute settle past core's
  # first metrics flush, then 10 of idle windows) to the 15 the other suites
  # take; the job ran 27 minutes with the 13-minute suite, so the limit is 45.
  debian-vm:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: debian-ubuntu-24.04
          path: dist
      - name: Disposable Debian signed-apt and systemd acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils genisoimage apt-utils gnupg acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          # Runner device permissions can be reset between QEMU processes.
          fct_run_vm() {
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            python3 tests/privileged_vm/run.py "$@"
          }
          mkdir -p .cache/p01-vm
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS -o .cache/p01-vm/SHA512SUMS
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2 -o .cache/p01-vm/debian-12-genericcloud-amd64.qcow2
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'LimeOS disposable CI key' ed25519 sign 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10; exit}')
          packaging/repository.sh "$PWD/dist/test-repo" "$key" dist/*.deb
          fct_run_vm --repository dist/test-repo --guest-script tests/privileged_vm/ci_foundation_guest.py --output docs/rewrite-evidence/p01/ci-vm-result.json
          fct_run_vm --repository dist/test-repo --guest-script tests/privileged_vm/ci_observations_guest.py --output docs/rewrite-evidence/p02/ci-vm-result.json
          python3 -m unittest discover -s tests/reference -p 'test_*.py'
          fct_run_vm --repository dist/test-repo --guest-script tests/privileged_vm/ci_reference_guest.py --output docs/rewrite-evidence/p03/ci-reference-vm-result.json
          fct_run_vm --repository dist/test-repo --guest-script tests/privileged_vm/ci_dependencies_guest.py --output docs/rewrite-evidence/p04/ci-dependencies-vm-result.json
          # measure.sh on the installed, idle candidate: PSS, disk writes, idle
          # CPU (a regression ceiling; the 0.1 % budget is not met) and readiness.
          fct_run_vm --repository dist/test-repo --guest-script tests/privileged_vm/ci_footprint_guest.py --output docs/rewrite-evidence/p06/ci-footprint-vm-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: debian-vm-evidence
          path: |
            docs/rewrite-evidence/p*/*vm-result.json
            docs/rewrite-evidence/p*/*vm-result-failed.json
            docs/rewrite-evidence/p*/*vm-failure.txt
  # Storage mounts are dormant in the shipped product, and this suite has not
  # passed on a runner since 16 October. It still runs and uploads its evidence,
  # but it does not gate the workflow until the mount path is taken up again.
  storage-mount-vm:
    needs: publish
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: debian-ubuntu-24.04
          path: dist
      - name: Disposable Debian approved-storage mount (dormant feature, not gating)
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils genisoimage apt-utils gnupg acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          # Runner device permissions can be reset between QEMU processes.
          fct_run_vm() {
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            python3 tests/privileged_vm/run.py "$@"
          }
          mkdir -p .cache/p01-vm
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS -o .cache/p01-vm/SHA512SUMS
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2 -o .cache/p01-vm/debian-12-genericcloud-amd64.qcow2
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'LimeOS disposable CI key' ed25519 sign 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10; exit}')
          packaging/repository.sh "$PWD/dist/test-repo" "$key" dist/*.deb
          fct_run_vm --repository dist/test-repo --storage-disks --guest-script tests/privileged_vm/p04_approved_guest.py --output docs/rewrite-evidence/p04/ci-approved-vm-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: storage-mount-vm-evidence
          path: |
            docs/rewrite-evidence/p*/*vm-result.json
            docs/rewrite-evidence/p*/*vm-failure.txt
  # Resolution of needs_intervention jobs end to end (API, limeosctl as root,
  # crash points, job list and job cancel): about 11 minutes in the guest plus
  # the VM's setup. Its crash cases depend on timing (7b has a second spare
  # for a missed crash point), and it went unrun long enough for core's
  # 30-second watchdog to break 7b unnoticed, so it runs on every push but
  # does not gate yet; make it gating once it has passed on runners for a
  # while. Kept out of debian-vm, whose suites already take most of its
  # 45-minute limit.
  resolution-vm:
    needs: publish
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: debian-ubuntu-24.04
          path: dist
      - name: Disposable Debian needs_intervention resolution (not gating)
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils genisoimage apt-utils gnupg acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          mkdir -p .cache/p01-vm
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS -o .cache/p01-vm/SHA512SUMS
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2 -o .cache/p01-vm/debian-12-genericcloud-amd64.qcow2
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'LimeOS disposable CI key' ed25519 sign 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10; exit}')
          packaging/repository.sh "$PWD/dist/test-repo" "$key" dist/*.deb
          python3 tests/privileged_vm/run.py --repository dist/test-repo --guest-script tests/privileged_vm/ci_resolution_guest.py --output docs/rewrite-evidence/p04/ci-resolution-vm-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: resolution-vm-evidence
          path: |
            docs/rewrite-evidence/p*/*vm-result.json
            docs/rewrite-evidence/p*/*vm-result-failed.json
            docs/rewrite-evidence/p*/*vm-failure.txt
  # Stack inventory and container-health reads at 30, 64 and 65 containers
  # (about four minutes). Gating: an 18-container Engine refusing the
  # container-health read rolled a migration back.
  stack-scale-vm:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: debian-ubuntu-24.04
          path: dist
      - name: Disposable Debian stack scale and container-health reads
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils genisoimage apt-utils gnupg acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          mkdir -p .cache/p01-vm
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS -o .cache/p01-vm/SHA512SUMS
          curl --fail --location https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2 -o .cache/p01-vm/debian-12-genericcloud-amd64.qcow2
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'LimeOS disposable CI key' ed25519 sign 1d
          key=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10; exit}')
          packaging/repository.sh "$PWD/dist/test-repo" "$key" dist/*.deb
          python3 tests/privileged_vm/run.py --repository dist/test-repo --guest-script tests/privileged_vm/ci_stack_scale_guest.py --output docs/rewrite-evidence/p04/ci-stack-scale-vm-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stack-scale-vm-evidence
          path: |
            docs/rewrite-evidence/p*/*vm-result.json
            docs/rewrite-evidence/p*/*vm-result-failed.json
            docs/rewrite-evidence/p*/*vm-failure.txt
