name: Combined Stream B leaf qualification
on:
  push:
    branches: [qualification/local-main-2026-10-19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leaves:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile proposed leaves against the registered automation domain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .cache/stream-b-qualification
          git rev-parse HEAD > .cache/stream-b-qualification/source.txt
          rustc -Vv > .cache/stream-b-qualification/rustc.txt
          cargo fetch --locked
          python3 tests/fixtures/stream-b/check-leaves.py
          # Preserve production resolutions while adding the four local wrappers.
          cp Cargo.lock .cache/stream-b-leaf/Cargo.lock
          cargo test --offline --manifest-path .cache/stream-b-leaf/Cargo.toml 2>&1 | tee .cache/stream-b-qualification/tests.log
          cargo clippy --offline --locked --manifest-path .cache/stream-b-leaf/Cargo.toml --all-targets -- -D warnings 2>&1 | tee .cache/stream-b-qualification/clippy.log
          cp .cache/stream-b-leaf/Cargo.lock .cache/stream-b-qualification/harness.lock
          sha256sum Cargo.lock .cache/stream-b-leaf/Cargo.lock > .cache/stream-b-qualification/locks.sha256
          git diff --exit-code --
      - name: Preserve source identity and actual leaf results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stream-b-leaves-${{ matrix.runner }}-${{ github.sha }}
          path: .cache/stream-b-qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
