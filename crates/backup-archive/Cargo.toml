[package]
name = "limeos-backup-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Deferred: no shipped binary uses this crate. Without the feature it compiles
# to an empty library; CI builds and tests it with `--features deferred`.
[features]
deferred = [
    "dep:limeos-domain",
    "limeos-domain/deferred",
    "dep:tar",
    "dep:flate2",
    "dep:zstd",
    "dep:sha2",
    "dep:hex",
    "dep:rustix",
    "dep:getrandom",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
limeos-domain = { path = "../domain", version = "=0.2.0", optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "archives"
required-features = ["deferred"]

[[test]]
name = "before_images"
required-features = ["deferred"]

[[test]]
name = "custody"
required-features = ["deferred"]

[[test]]
name = "preparation"
required-features = ["deferred"]

[[example]]
name = "custody"
required-features = ["deferred"]

[[example]]
name = "inspect"
required-features = ["deferred"]

[[example]]
name = "stage"
required-features = ["deferred"]
