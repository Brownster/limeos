[workspace]
members = ["spikes/footprint", "crates/*", "bins/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "process"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
schemars = "=1.0.4"
ts-rs = { version = "=11.0.1", features = ["serde-compat", "no-serde-warnings"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
getrandom = "=0.2.17"
subtle = "=2.6.1"
argon2 = "=0.5.3"
scrypt = { version = "=0.11.0", default-features = false }
pbkdf2 = "=0.12.2"
fs2 = "=0.4.3"
tempfile = "=3.23.0"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "json", "registry"] }
hyper = { version = "=1.11.1", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.3"
futures-util = "=0.3.34"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Exercise real password deadlines in development without unoptimized KDF loops.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.limeos-identity]
opt-level = 3
